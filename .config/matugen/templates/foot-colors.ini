# ===================================================================
# 🎨 FOOT MATUGEN THEME 
# ===================================================================

[colors-dark]
# Cursor Colors (Format: <text-color> <cursor-color>)
cursor={{colors.on_surface_variant.default.hex_stripped}} {{colors.on_surface.default.hex_stripped}}

# Base UI Colors
foreground={{colors.on_surface.default.hex_stripped}}
background={{colors.surface.default.hex_stripped}}
selection-foreground={{colors.on_secondary.default.hex_stripped}}
selection-background={{colors.secondary_fixed_dim.default.hex_stripped}}
urls={{colors.primary.default.hex_stripped}}

# ===================================================================
# 16-COLOR TERMINAL PALETTE
# ===================================================================
# Normal colors
regular0={{colors.surface_container.dark.hex_stripped}}  # black
regular1={{colors.error.dark.hex_stripped}}
  # red
regular2={{colors.primary.dark.hex_stripped}}  # green
regular3={{colors.secondary.dark.hex_stripped}}  # yellow
regular4={{colors.primary_fixed_dim.dark.hex_stripped}}
  # blue (Matugen dynamically injected)
regular5={{colors.tertiary.dark.hex_stripped}}  # magenta
regular6={{colors.primary_container.light.hex_stripped}}  # cyan
regular7={{colors.on_surface_variant.dark.hex_stripped}}  # white

# Bright colors
bright0={{colors.surface_container_high.dark.hex_stripped}}   # bright black
bright1={{colors.error_container.dark.hex_stripped}}   # bright red
bright2={{colors.primary_container.dark.hex_stripped}}
   # bright green
bright3={{colors.secondary_container.dark.hex_stripped}}   # bright yellow
bright4={{colors.primary_fixed.dark.hex_stripped}}   # bright blue
bright5={{colors.tertiary_container.dark.hex_stripped}}   # bright magenta
bright6={{colors.primary_container.light.hex_stripped}}   # bright cyan
bright7={{colors.on_surface.dark.hex_stripped}}   # bright white
