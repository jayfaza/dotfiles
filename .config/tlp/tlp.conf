# TLP Configuration for ThinkPad T14 Gen1 (i5 10th gen, 40Wh battery)
# Profiles: _ON_AC = Performance profile, _ON_BAT = Balanced profile

# ================== CPU and Performance ==================
CPU_DRIVER_OPMODE_ON_AC=active
CPU_DRIVER_OPMODE_ON_BAT=active

CPU_SCALING_GOVERNOR_ON_AC=performance     # Можно также schedutil
CPU_SCALING_GOVERNOR_ON_BAT=performance # или schedutil для лучшего баланса

CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=powersave

INTEL_HWP_ON_BAT=powersave

CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=100
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=50 # ограничение макс. производительности CPU на BAT

CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1       # разрешаем Turbo (для макс. отклика; выключить =0 для более долгой жизни батареи)
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=1

# ================== Platform Profile ==================
PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=low-power   # если доступен

# ================== Disks and Controllers ==================
# Основной диск NVMe: нет спиннинга
DISK_DEVICES="nvme0n1"

DISK_APM_LEVEL_ON_AC="254 254"
DISK_APM_LEVEL_ON_BAT="128 128"

DISK_SPINDOWN_TIMEOUT_ON_AC="0 0"
DISK_SPINDOWN_TIMEOUT_ON_BAT="0 0"

SATA_LINKPWR_ON_AC="med_power_with_dipm"
SATA_LINKPWR_ON_BAT="med_power_with_dipm"

AHCI_RUNTIME_PM_ON_AC=on
AHCI_RUNTIME_PM_ON_BAT=auto
AHCI_RUNTIME_PM_TIMEOUT=15

# ================== USB ==================
USB_AUTOSUSPEND=1
USB_DENYLIST=""
USB_EXCLUDE_AUDIO=1      # не отключать USB-аудио
USB_EXCLUDE_BTUSB=0      # 0 = не исключать Bluetooth; поставьте 1, если проблемы с BT
USB_EXCLUDE_PHONE=1
USB_EXCLUDE_PRINTER=1
USB_EXCLUDE_WWAN=0

# ================== Networking ==================
WIFI_PWR_ON_AC=off       # на AC не включаем Wi-Fi PowerSave (нет смысла)
WIFI_PWR_ON_BAT=on       # на BAT разрешаем энергосберегающий режим Wi-Fi

WOL_DISABLE=Y           # отключить Wake-on-LAN

# ==== Radio Devices ====
DEVICES_TO_DISABLE_ON_BAT="bluetooth wwan"
# (Wi-Fi оставляем включенным на батарее, BT и WWAN отключаются для экономии)
DEVICES_TO_ENABLE_ON_AC="bluetooth wwan"

# ================== Power Management ==================
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto  # включить PCIe runtime PM на батарее

PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave # оставить «default» (рекомендуется)

# ================== Others ==================
# (не менять основные параметры подсветки и suspend)
TP_ACPI_ENABLE=1
TP_FAN_CONTROL=0

USB_AUTOSUSPEND_DELAY_ON_BAT=2  
CPU_BOOST_TIMEOUT_ON_BAT=5






































































































































































































































































































